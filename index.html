<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EST CONVERTER | WebP to PNG/JPEG Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            color: var(--text);
            background-color: #f1f5f9;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }
        
        .tagline {
            color: var(--text-light);
            font-size: 1.125rem;
            font-weight: 400;
        }
        
        .converter-card {
            background-color: white;
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }
        
        .drop-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: var(--secondary);
        }
        
        .drop-area.highlight {
            border-color: var(--primary);
            background-color: rgba(37, 99, 235, 0.05);
        }
        
        .drop-area p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-light);
        }
        
        .drop-area .icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .file-input {
            display: none;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background-color: white;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background-color: var(--secondary);
            border-color: var(--primary);
        }
        
        .options {
            margin-bottom: 1.5rem;
        }
        
        .option-group {
            margin-bottom: 1.25rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text);
        }
        
        select, input[type="range"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: white;
            font-family: inherit;
        }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
        }
        
        .quality-value {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }
        
        .result {
            margin-top: 1.5rem;
            display: none;
        }
        
        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .preview {
            text-align: center;
        }
        
        .preview-title {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }
        
        .preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .file-info {
            font-size: 0.875rem;
            color: var(--text-light);
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .file-info span {
            font-weight: 500;
            color: var(--text);
        }
        
        .action-btns {
            display: flex;
            gap: 1rem;
        }
        
        .action-btns .btn {
            flex: 1;
        }
        
        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }
        
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .preview-container {
                grid-template-columns: 1fr;
            }
            
            .action-btns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">EST CONVERTER</div>
            <div class="tagline">Premium WebP to PNG/JPEG Conversion Tool</div>
        </header>
        
        <main class="converter-card">
            <div id="dropArea" class="drop-area">
                <div class="icon">📁</div>
                <p>Drag & drop your WebP image here</p>
                <p>or</p>
                <input type="file" id="fileInput" class="file-input" accept="image/webp">
                <button id="selectFileBtn" class="btn btn-secondary" type="button">Select File</button>
            </div>
            
            <div class="options">
                <div class="option-group">
                    <label for="outputFormat">Output Format</label>
                    <select id="outputFormat">
                        <option value="png">PNG </option>
                        <option value="jpeg">JPEG </option>
                    </select>
                </div>
                
                <div class="option-group" id="qualityGroup" style="display: none;">
                    <label for="quality">JPEG Quality: <span id="qualityValue" class="quality-value">80%</span></label>
                    <input type="range" id="quality" min="10" max="100" value="80">
                </div>
            </div>
            
            <button id="convertBtn" class="btn" type="button" disabled>Convert Image</button>
            
            <div id="result" class="result">
                <div class="preview-container">
                    <div class="preview">
                        <div class="preview-title">Original (WebP)</div>
                        <img id="originalPreview" src="" alt="Original WebP">
                    </div>
                    <div class="preview">
                        <div class="preview-title">Converted (<span id="convertedFormatText">PNG</span>)</div>
                        <img id="convertedPreview" src="" alt="Converted Image">
                    </div>
                </div>
                
                <div class="file-info">
                    <p>Original size: <span id="originalSize">-</span> | Converted size: <span id="convertedSize">-</span></p>
                </div>
                
                <div class="action-btns">
                    <button id="downloadBtn" class="btn" type="button">Download Converted Image</button>
                    <button id="resetBtn" class="btn btn-secondary" type="button">Convert Another</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 EST. All rights reserved. | Simple, secure image conversion in your browser.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM elements
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const selectFileBtn = document.getElementById('selectFileBtn');
            const convertBtn = document.getElementById('convertBtn');
            const outputFormat = document.getElementById('outputFormat');
            const qualityGroup = document.getElementById('qualityGroup');
            const quality = document.getElementById('quality');
            const qualityValue = document.getElementById('qualityValue');
            const result = document.getElementById('result');
            const originalPreview = document.getElementById('originalPreview');
            const convertedPreview = document.getElementById('convertedPreview');
            const convertedFormatText = document.getElementById('convertedFormatText');
            const originalSize = document.getElementById('originalSize');
            const convertedSize = document.getElementById('convertedSize');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            let currentFile = null;
            let convertedBlob = null;
            
            // Event listeners
            selectFileBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            dropArea.addEventListener('dragover', handleDragOver);
            dropArea.addEventListener('dragleave', handleDragLeave);
            dropArea.addEventListener('drop', handleDrop);
            outputFormat.addEventListener('change', updateFormatOptions);
            quality.addEventListener('input', updateQualityValue);
            convertBtn.addEventListener('click', convertImage);
            downloadBtn.addEventListener('click', downloadConvertedImage);
            resetBtn.addEventListener('click', resetConverter);
            
            // Functions
            function handleFileSelect(e) {
                const file = e.target.files[0];
                if (file && file.type === 'image/webp') {
                    processFile(file);
                } else {
                    showAlert('Please select a valid WebP image file.');
                }
            }
            
            function handleDragOver(e) {
                e.preventDefault();
                e.stopPropagation();
                dropArea.classList.add('highlight');
            }
            
            function handleDragLeave(e) {
                e.preventDefault();
                e.stopPropagation();
                dropArea.classList.remove('highlight');
            }
            
            function handleDrop(e) {
                e.preventDefault();
                e.stopPropagation();
                dropArea.classList.remove('highlight');
                
                const file = e.dataTransfer.files[0];
                if (file && file.type === 'image/webp') {
                    processFile(file);
                } else {
                    showAlert('Please drop a valid WebP image file.');
                }
            }
            
            function processFile(file) {
                currentFile = file;
                convertBtn.disabled = false;
                
                // Show original preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalPreview.src = e.target.result;
                    originalSize.textContent = formatFileSize(file.size);
                };
                reader.readAsDataURL(file);
            }
            
            function updateFormatOptions() {
                const format = outputFormat.value;
                convertedFormatText.textContent = format.toUpperCase();
                
                if (format === 'jpeg') {
                    qualityGroup.style.display = 'block';
                } else {
                    qualityGroup.style.display = 'none';
                }
            }
            
            function updateQualityValue() {
                qualityValue.textContent = `${quality.value}%`;
            }
            
            function convertImage() {
                if (!currentFile) return;
                
                convertBtn.disabled = true;
                convertBtn.textContent = 'Converting...';
                
                const format = outputFormat.value;
                const img = new Image();
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    let mimeType, fileName;
                    
                    if (format === 'jpeg') {
                        mimeType = 'image/jpeg';
                        fileName = currentFile.name.replace('.webp', '.jpg');
                        const qualityValue = parseInt(quality.value) / 100;
                        canvas.toBlob(function(blob) {
                            handleConversionResult(blob, fileName, mimeType);
                        }, mimeType, qualityValue);
                    } else {
                        mimeType = 'image/png';
                        fileName = currentFile.name.replace('.webp', '.png');
                        canvas.toBlob(function(blob) {
                            handleConversionResult(blob, fileName, mimeType);
                        }, mimeType);
                    }
                };
                
                img.onerror = function() {
                    showAlert('Error loading image. Please try another file.');
                    convertBtn.disabled = false;
                    convertBtn.textContent = 'Convert Image';
                };
                
                img.src = URL.createObjectURL(currentFile);
            }
            
            function handleConversionResult(blob, fileName, mimeType) {
                convertedBlob = blob;
                
                // Show converted preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    convertedPreview.src = e.target.result;
                    convertedSize.textContent = formatFileSize(blob.size);
                    result.style.display = 'block';
                    
                    // Scroll to result
                    result.scrollIntoView({ behavior: 'smooth' });
                    
                    convertBtn.textContent = 'Convert Image';
                };
                reader.readAsDataURL(blob);
            }
            
            function downloadConvertedImage() {
                if (!convertedBlob) return;
                
                const format = outputFormat.value;
                let extension = format === 'jpeg' ? 'jpg' : 'png';
                let fileName = currentFile.name.replace('.webp', `.${extension}`);
                
                const url = URL.createObjectURL(convertedBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            function resetConverter() {
                fileInput.value = '';
                currentFile = null;
                convertedBlob = null;
                convertBtn.disabled = true;
                result.style.display = 'none';
                originalPreview.src = '';
                convertedPreview.src = '';
                originalSize.textContent = '-';
                convertedSize.textContent = '-';
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            function showAlert(message) {
                alert(message);
            }
            
            // Initialize
            updateFormatOptions();
        });
    </script>
</body>
</html>
