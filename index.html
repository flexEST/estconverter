<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert WebP images to PNG or JPEG formats with ease using EST Converter. Fast, secure, and simple online image conversion tool.">
    <meta name="keywords" content="WebP to PNG converter, WebP to JPEG converter, image converter, image conversion, online image converter, free WebP converter">
    <meta name="author" content="EST Converter">
    <meta name="robots" content="index, follow">
    <title>EST CONVERTER | WebP to PNG/JPEG Converter</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- Add your favicon here -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            color: var(--text);
            background-color: #f1f5f9;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }

        .tagline {
            color: var(--text-light);
            font-size: 1.125rem;
            font-weight: 400;
        }

        .converter-card {
            background-color: white;
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .drop-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: var(--secondary);
        }

        .drop-area.highlight {
            border-color: var(--primary);
            background-color: rgba(37, 99, 235, 0.05);
        }

        .drop-area p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-light);
        }

        .drop-area .icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .file-input {
            display: none;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: white;
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--secondary);
            border-color: var(--primary);
        }

        .options {
            margin-bottom: 1.5rem;
        }

        .option-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text);
        }

        select, input[type="range"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: white;
            font-family: inherit;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
        }

        .quality-value {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .result {
            margin-top: 1.5rem;
            display: none;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .preview {
            text-align: center;
        }

        .preview-title {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        .preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .file-info {
            font-size: 0.875rem;
            color: var(--text-light);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .file-info span {
            font-weight: 500;
            color: var(--text);
        }

        .action-btns {
            display: flex;
            gap: 1rem;
        }

        .action-btns .btn {
            flex: 1;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .logo {
                font-size: 2rem;
            }

            .preview-container {
                grid-template-columns: 1fr;
            }

            .action-btns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">EST CONVERTER</div>
            <div class="tagline">Premium WebP to PNG/JPEG Conversion Tool</div>
        </header>

        <main class="converter-card">
            <div id="dropArea" class="drop-area">
                <div class="icon">📁</div>
                <p>Drag & drop your WebP image here</p>
                <p>or</p>
                <input type="file" id="fileInput" class="file-input" accept="image/webp">
                <button id="selectFileBtn" class="btn btn-secondary" type="button">Select File</button>
            </div>

            <div class="options">
                <div class="option-group">
                    <label for="outputFormat">Output Format</label>
                    <select id="outputFormat">
                        <option value="png">PNG </option>
                        <option value="jpeg">JPEG </option>
                    </select>
                </div>

                <div class="option-group" id="qualityGroup" style="display: none;">
                    <label for="quality">JPEG Quality: <span id="qualityValue" class="quality-value">80%</span></label>
                    <input type="range" id="quality" min="10" max="100" value="80">
                </div>
            </div>

            <button id="convertBtn" class="btn" type="button" disabled>Convert Image</button>

            <div id="result" class="result">
                <div class="preview-container">
                    <div class="preview">
                        <div class="preview-title">Original (WebP)</div>
                        <img id="originalPreview" src="" alt="Original Image">
                    </div>
                    <div class="preview">
                        <div class="preview-title">Converted</div>
                        <img id="convertedPreview" src="" alt="Converted Image">
                    </div>
                </div>
                <div class="file-info">
                    File Size: <span id="fileSize"></span>
                </div>
                <div class="action-btns">
                    <button id="downloadBtn" class="btn" disabled>Download</button>
                    <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 EST Converter. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // JavaScript code for functionality (file upload, conversion, etc.)
    </script>
</body>
</html>
